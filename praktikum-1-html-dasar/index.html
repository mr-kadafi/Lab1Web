<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratikum HTML Dasar</title>
</head>

<body>

    <!-- judul utama -->
    <h1>Belajar Dasar HTML</h1>

    <!-- Ini adalah paragraf pertama -->
    <p>
        <small>sedang belajar</small> <b>HTML dasar</b> <em>mata kuliah</em>
        <i>Pemrograman Web</i>.
    </p>

    <!-- subjudul -->
    <h2>Paragraf pada HTML</h2>

    <!-- Ini adalah paragraf kedua -->
    <p>
        <mark>HTML merupakan</mark> <strong>bahasa markup</strong> <del>menyusunstruktur halaman web.</del>
    </p>
    <p>
        <ins>Air ditulis sebagai H</ins><sub>2</sub>O dan luas dapat ditulis
        sebagai x<sup>2</sup>.
    </p>

    <h3>Menambahkan Gambar</h3>
    <img src="images/profil.png" width="200" alt="Foto profil mahasiswa" title="Foto Profil Mahasiswa">

    <!-- navigasi halaman -->
    <nav>
        <a href="index.html">Dasar HTML</a>
        <a href="halaman2.html">Halaman 2</a>
        <a href="https://www.google.com">Website Eksternal</a>
    </nav>

</body>

</html>
